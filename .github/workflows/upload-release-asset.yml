name: Upload release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: v0.1.0
      asset:
        description: Asset path to upload
        required: true
        default: ScreenNotepad-v0.1.0.dmg

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          gh release upload "$TAG" "$ASSET" --clobber
